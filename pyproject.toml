[project]
name = "tacintosh"
version = "0.1.0"
description = "Terminal tic-tac-toe against Apple's on-device language model."
requires-python = ">=3.12"
dependencies = [
    "textual>=8.2,<9",
    "apple-fm-sdk>=0.2.1,<0.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tacintosh*"]
